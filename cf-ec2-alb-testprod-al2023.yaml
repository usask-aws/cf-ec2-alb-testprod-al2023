AWSTemplateFormatVersion: '2010-09-09'
Description: Test and Prod EC2 instances with one Application Load Balancer

Parameters:
  AmiIdTest:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: 'Amazon machine image ID for test environment'

  AmiIdProd:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: 'Amazon machine image ID for prod environment'

  InstanceTypeTest:
    Type: String
    Default: t2.micro
    Description: 'Instance type for test environment'

  InstanceTypeProd:
    Type: String
    Default: t2.micro
    Description: 'Instance type for prod environment'

  SubnetIdTest:
    Type: AWS::EC2::Subnet::Id
    Description: 'Subnet ID for test environment (MUST BE PRIVATE)'

  SubnetIdProd:
    Type: AWS::EC2::Subnet::Id
    Description: 'Subnet ID for prod environment (MUST BE PRIVATE)'

  LoadBalancerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 'Subnet IDs(TWO) for loadbalancer (MUST BE PUBLIC)'

  InstanceProfileName:
    Type: String
    Default: DefaultEC2InstanceProfile
    Description: 'Instance profile name'

  KeyPairNameTest:
    Type: 'String'
    Default: ""
    Description: 'Optional: Select an existing EC2 Key Pair to enable SSH access to the test instance'

  KeyPairNameProd:
    Type: 'String'
    Default: ""
    Description: 'Optional: Select an existing EC2 Key Pair to enable SSH access to the prod instance'

  EC2NameTest:
    Type: String
    Default: Test-EC2-Instance

  EC2NameProd:
    Type: String
    Default: Prod-EC2-Instance

  VpcId:
    Type: AWS::EC2::VPC::Id

  LoadBalancerName:
    Type: String
    Default: App-ALB

  TargetGroupNameTest:
    Type: String
    Default: Test-App-TG

  TargetGroupNameProd:
    Type: String
    Default: Prod-App-TG

  AppPort:
    Type: Number
    Default: 80

  HealthCheckPath:
    Type: String
    Default: /health

  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0

  CertificateArn:
    Type: String
    Default: ""

  DataVolumeTypeTest:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2
      - io1
      - io2
      - st1
      - sc1
    Description: 'EBS volume type for the additional data volume attached to the test instance'

  DataVolumeSizeTest:
    Type: Number
    Default: 20
    MinValue: 1
    Description: 'Size (GiB) of the additional data volume attached to the test instance'

  DataVolumeTypeProd:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2
      - io1
      - io2
      - st1
      - sc1
    Description: 'EBS volume type for the additional data volume attached to the prod instance'

  DataVolumeSizeProd:
    Type: Number
    Default: 20
    MinValue: 1
    Description: 'Size (GiB) of the additional data volume attached to the prod instance'

Conditions:
  HasKeyPairTest: !Not [ !Equals [ !Ref KeyPairNameTest, "" ] ]
  HasKeyPairProd: !Not [ !Equals [ !Ref KeyPairNameProd, "" ] ]
  HasCertificate: !Not [ !Equals [ !Ref CertificateArn, "" ] ]

Resources:
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
        - !If
          - HasCertificate
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref AllowedHttpCidr
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub '${LoadBalancerName}-SG'

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: EC2-App-SG

  LoadBalancerSecurityGroupEgressToEC2:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadBalancerSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      DestinationSecurityGroupId: !Ref EC2SecurityGroup

  TestEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiIdTest
      InstanceType: !Ref InstanceTypeTest
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !If
        - HasKeyPairTest
        - !Ref KeyPairNameTest
        - !Ref AWS::NoValue
      Monitoring: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        HttpEndpoint: enabled
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetIdTest
          AssociatePublicIpAddress: false
          GroupSet:
            - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          DEVICE=/dev/xvdf
          for i in $(seq 1 30); do
            [ -e /dev/nvme1n1 ] && DEVICE=/dev/nvme1n1
            [ -e $DEVICE ] && break
            sleep 5
          done
          MOUNT_POINT=/data
          if ! blkid $DEVICE >/dev/null 2>&1; then
            mkfs -t xfs $DEVICE
          fi
          mkdir -p $MOUNT_POINT
          UUID=$(blkid -s UUID -o value $DEVICE)
          grep -q "$UUID" /etc/fstab || echo "UUID=$UUID $MOUNT_POINT xfs defaults,nofail 0 2" >> /etc/fstab
          mount -a

          dnf update -y
          dnf install -y httpd php php-cli tree

          DOCROOT=$MOUNT_POINT/www/html
          mkdir -p $DOCROOT/test
          sed -i "s#/var/www/html#$DOCROOT#g" /etc/httpd/conf/httpd.conf
          echo "Test Works" > $DOCROOT/index.php
          echo "OK" > $DOCROOT/health
          echo "Test Works" > $DOCROOT/test/index.php
          echo "OK" > $DOCROOT/test/health

          systemctl enable httpd
          systemctl start httpd

      Tags:
        - Key: Name
          Value: !Ref EC2NameTest
        - Key: Environment
          Value: test

  TestDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt TestEC2Instance.AvailabilityZone
      VolumeType: !Ref DataVolumeTypeTest
      Size: !Ref DataVolumeSizeTest
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${EC2NameTest}-data'

  TestDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref TestEC2Instance
      VolumeId: !Ref TestDataVolume
      Device: /dev/sdf

  ProdEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiIdProd
      InstanceType: !Ref InstanceTypeProd
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !If
        - HasKeyPairProd
        - !Ref KeyPairNameProd
        - !Ref AWS::NoValue
      Monitoring: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        HttpEndpoint: enabled
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetIdProd
          AssociatePublicIpAddress: false
          GroupSet:
            - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          DEVICE=/dev/xvdf
          for i in $(seq 1 30); do
            [ -e /dev/nvme1n1 ] && DEVICE=/dev/nvme1n1
            [ -e $DEVICE ] && break
            sleep 5
          done
          MOUNT_POINT=/data
          if ! blkid $DEVICE >/dev/null 2>&1; then
            mkfs -t xfs $DEVICE
          fi
          mkdir -p $MOUNT_POINT
          UUID=$(blkid -s UUID -o value $DEVICE)
          grep -q "$UUID" /etc/fstab || echo "UUID=$UUID $MOUNT_POINT xfs defaults,nofail 0 2" >> /etc/fstab
          mount -a

          dnf update -y
          dnf install -y httpd php php-cli tree

          DOCROOT=$MOUNT_POINT/www/html
          mkdir -p $DOCROOT
          sed -i "s#/var/www/html#$DOCROOT#g" /etc/httpd/conf/httpd.conf
          echo "Prod Works" > $DOCROOT/index.php
          echo "OK" > $DOCROOT/health

          systemctl enable httpd
          systemctl start httpd
      Tags:
        - Key: Name
          Value: !Ref EC2NameProd
        - Key: Environment
          Value: prod

  ProdDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt ProdEC2Instance.AvailabilityZone
      VolumeType: !Ref DataVolumeTypeProd
      Size: !Ref DataVolumeSizeProd
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${EC2NameProd}-data'

  ProdDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref ProdEC2Instance
      VolumeId: !Ref ProdDataVolume
      Device: /dev/sdf

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref LoadBalancerName
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !Ref LoadBalancerSubnetIds

  TestTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Ref TargetGroupNameTest
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref AppPort
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: 200-399
      Targets:
        - Id: !Ref TestEC2Instance
          Port: !Ref AppPort

  ProdTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Ref TargetGroupNameProd
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref AppPort
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: 200-399
      Targets:
        - Id: !Ref ProdEC2Instance
          Port: !Ref AppPort

  ApplicationListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProdTargetGroup

  HttpsApplicationListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProdTargetGroup

  TestListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !If
        - HasCertificate
        - !Ref HttpsApplicationListener
        - !Ref ApplicationListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /test/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TestTargetGroup

Outputs:
  TestEC2InstanceId:
    Value: !Ref TestEC2Instance

  ProdEC2InstanceId:
    Value: !Ref ProdEC2Instance

  EC2SecurityGroupId:
    Value: !Ref EC2SecurityGroup

  LoadBalancerSecurityGroupId:
    Value: !Ref LoadBalancerSecurityGroup

  LoadBalancerDNSName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  TestTargetGroupArn:
    Value: !Ref TestTargetGroup

  ProdTargetGroupArn:
    Value: !Ref ProdTargetGroup

  TestDataVolumeId:
    Value: !Ref TestDataVolume

  ProdDataVolumeId:
    Value: !Ref ProdDataVolume
