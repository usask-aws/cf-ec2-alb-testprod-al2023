AWSTemplateFormatVersion: '2010-09-09'
Description: Create AWS WAF Web ACL with optional AWS managed rules, metrics enabled, and associate with an existing ALB

Parameters:
  WebACLName:
    Type: String
    Default: Standalone-App-WAF

  LoadBalancerArn:
    Description: ARN of the existing Application Load Balancer
    Type: String

  EnableCommonRuleSet:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  EnableKnownBadInputsRuleSet:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  EnableAmazonIpReputationList:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  EnableCloudWatchMetrics:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  EnableSampledRequests:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  CountModeSizeRestrictionsBody:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CountModeSizeRestrictionsQueryString:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CountModeNoUserAgentHeader:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CountModeCrossSiteScriptingBody:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CountModeCrossSiteScriptingQueryArguments:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CountModeHostLocalhostHeader:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  CountModePropfindMethod:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  EnableRateLimitRule:
    Description: Add a rate-based rule that blocks a single source IP once it exceeds RateLimitThreshold requests in a rolling 5-minute window
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  RateLimitThreshold:
    Description: Max requests a single source IP may send in a rolling 5-minute window before EnableRateLimitRule blocks it (only used when EnableRateLimitRule is "true")
    Type: Number
    Default: 2000
    MinValue: 100

Conditions:
  UseCommonRuleSet: !Equals [!Ref EnableCommonRuleSet, "true"]
  UseKnownBadInputsRuleSet: !Equals [!Ref EnableKnownBadInputsRuleSet, "true"]
  UseAmazonIpReputationList: !Equals [!Ref EnableAmazonIpReputationList, "true"]
  UseCloudWatchMetrics: !Equals [!Ref EnableCloudWatchMetrics, "true"]
  UseSampledRequests: !Equals [!Ref EnableSampledRequests, "true"]
  IsCountModeSizeRestrictionsBody: !Equals [!Ref CountModeSizeRestrictionsBody, "true"]
  IsCountModeSizeRestrictionsQueryString: !Equals [!Ref CountModeSizeRestrictionsQueryString, "true"]
  IsCountModeNoUserAgentHeader: !Equals [!Ref CountModeNoUserAgentHeader, "true"]
  IsCountModeCrossSiteScriptingBody: !Equals [!Ref CountModeCrossSiteScriptingBody, "true"]
  IsCountModeCrossSiteScriptingQueryArguments: !Equals [!Ref CountModeCrossSiteScriptingQueryArguments, "true"]
  IsCountModeHostLocalhostHeader: !Equals [!Ref CountModeHostLocalhostHeader, "true"]
  IsCountModePropfindMethod: !Equals [!Ref CountModePropfindMethod, "true"]
  UseRateLimitRule: !Equals [!Ref EnableRateLimitRule, "true"]

Resources:
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Ref WebACLName
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: !If [UseCloudWatchMetrics, true, false]
        MetricName: !Ref WebACLName
        SampledRequestsEnabled: !If [UseSampledRequests, true, false]
      Rules:
        - !If
          - UseCommonRuleSet
          - Name: CommonRuleSet
            Priority: 10
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesCommonRuleSet
                RuleActionOverrides:
                  - !If
                    - IsCountModeSizeRestrictionsBody
                    - Name: SizeRestrictions_BODY
                      ActionToUse:
                        Count: {}
                    - !Ref AWS::NoValue
                  - !If
                    - IsCountModeSizeRestrictionsQueryString
                    - Name: SizeRestrictions_QUERYSTRING
                      ActionToUse:
                        Count: {}
                    - !Ref AWS::NoValue
                  - !If
                    - IsCountModeNoUserAgentHeader
                    - Name: NoUserAgent_HEADER
                      ActionToUse:
                        Count: {}
                    - !Ref AWS::NoValue
                  - !If
                    - IsCountModeCrossSiteScriptingBody
                    - Name: CrossSiteScripting_BODY
                      ActionToUse:
                        Count: {}
                    - !Ref AWS::NoValue
                  - !If
                    - IsCountModeCrossSiteScriptingQueryArguments
                    - Name: CrossSiteScripting_QUERYARGUMENTS
                      ActionToUse:
                        Count: {}
                    - !Ref AWS::NoValue
            VisibilityConfig:
              CloudWatchMetricsEnabled: !If [UseCloudWatchMetrics, true, false]
              MetricName: CommonRuleSet
              SampledRequestsEnabled: !If [UseSampledRequests, true, false]
          - !Ref AWS::NoValue

        - !If
          - UseKnownBadInputsRuleSet
          - Name: KnownBadInputs
            Priority: 20
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesKnownBadInputsRuleSet
                RuleActionOverrides:
                  - !If
                    - IsCountModeHostLocalhostHeader
                    - Name: Host_localhost_HEADER
                      ActionToUse:
                        Count: {}
                    - !Ref AWS::NoValue
                  - !If
                    - IsCountModePropfindMethod
                    - Name: PROPFIND_METHOD
                      ActionToUse:
                        Count: {}
                    - !Ref AWS::NoValue
            VisibilityConfig:
              CloudWatchMetricsEnabled: !If [UseCloudWatchMetrics, true, false]
              MetricName: KnownBadInputs
              SampledRequestsEnabled: !If [UseSampledRequests, true, false]
          - !Ref AWS::NoValue

        - !If
          - UseAmazonIpReputationList
          - Name: IpReputation
            Priority: 30
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAmazonIpReputationList
            VisibilityConfig:
              CloudWatchMetricsEnabled: !If [UseCloudWatchMetrics, true, false]
              MetricName: IpReputation
              SampledRequestsEnabled: !If [UseSampledRequests, true, false]
          - !Ref AWS::NoValue

        - !If
          - UseRateLimitRule
          - Name: RateLimit
            Priority: 40
            Action:
              Block: {}
            Statement:
              RateBasedStatement:
                Limit: !Ref RateLimitThreshold
                AggregateKeyType: IP
            VisibilityConfig:
              CloudWatchMetricsEnabled: !If [UseCloudWatchMetrics, true, false]
              MetricName: RateLimit
              SampledRequestsEnabled: !If [UseSampledRequests, true, false]
          - !Ref AWS::NoValue

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancerArn
      WebACLArn: !GetAtt WebACL.Arn

Outputs:
  WebACLArn:
    Value: !GetAtt WebACL.Arn

  WebACLId:
    Value: !GetAtt WebACL.Id

  AssociatedLoadBalancerArn:
    Value: !Ref LoadBalancerArn
